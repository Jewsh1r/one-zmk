CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=1800

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Split keyboard configuration
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERAL_INIT_PRIORITY=41
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BONDS_PER_PEER=2

# Bluetooth bonding settings for split keyboards
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
CONFIG_BT_BONDING_REQUIRED=y
